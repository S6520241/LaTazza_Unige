/*
 * LaTazza - Fondamenti di Ingegneria del Software a.a. 2025/2026
 * Progetto sostitutivo - progetto Gradle di partenza.
 */

plugins {
    // Apply the application plugin to add support for building a CLI/GUI application in Java.
    id 'application'
    // Adds JavaFX as regular dependencies, resolved automatically for your platform.
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = "21.0.2"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

application {
    // Define the main class for the application.
    mainClass = 'application.Main'
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.h2database:h2:2.2.224'
}
tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

// Main.java / Controller.java read/write "res/icon.png" and "res/laTazza.txt"
// as plain relative filesystem paths, relative to this module's directory (app/).
